<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>SA Map</title>

  <!-- Tell Cesium where its Workers/Assets live, BEFORE the library loads -->
  <script>
    window.CESIUM_BASE_URL = "https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/";
  </script>

  <!-- CesiumJS from the official CDN (ships the full build: Workers, Assets, Widgets) -->
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Cesium.js"></script>

  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000;
    }
    .cesium-widget-credits { display: none !important; }
    /* On-screen error banner so you can debug on the phone */
    #err {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 9999;
      font: 13px -apple-system, monospace; color: #fff; background: #b00020;
      padding: 10px 12px; white-space: pre-wrap; display: none;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="err"></div>

  <script>
    // Show any real error on screen instead of a silent black globe.
    function showErr(msg) {
      var e = document.getElementById("err");
      e.textContent = "ERROR: " + msg;
      e.style.display = "block";
    }
    window.onerror = function (m, src, line, col, error) {
      showErr((error && error.message) ? error.message : m);
    };

    try {
      // No Cesium Ion account or token needed — we supply our own map tiles.
      Cesium.Ion.defaultAccessToken = "";

      const viewer = new Cesium.Viewer("cesiumContainer", {
        baseLayer: Cesium.ImageryLayer.fromProviderAsync(
          Cesium.OpenStreetMapImageryProvider.fromUrl("https://tile.openstreetmap.org/")
        ),
        baseLayerPicker: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: true,
        navigationHelpButton: false,
        animation: false,
        timeline: false,
        fullscreenButton: false
      });

      // Point the camera at the continental US.
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(-98.0, 39.0, 6000000),
        duration: 0
      });
    } catch (e) {
      showErr(e.message);
    }
  </script>
</body>
</html>
