<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a0a0f">
  <title>Overwatch</title>

  <!-- CesiumJS 1.146 -->
  <script>window.CESIUM_BASE_URL = "https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/";</script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.146/Build/Cesium/Cesium.js"></script>

  <style>
    /* ── Reset ─────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0a0a0f; color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Map container ────────────────────────────── */
    #cesiumContainer { position: absolute; inset: 0; }

    /* Keep Google / Cesium attribution visible but subtle */
    .cesium-viewer-bottom {
      opacity: 0.35; font-size: 10px !important;
      pointer-events: auto;
    }

    /* ── Loading overlay ──────────────────────────── */
    #loading {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0a0a0f;
      transition: opacity 1s ease, visibility 1s;
    }
    #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    #loading h1 {
      font-size: 15px; font-weight: 700;
      letter-spacing: 4px; text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      margin-bottom: 20px;
    }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(255,255,255,0.08);
      border-top-color: rgba(255,255,255,0.5);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── HUD bar ──────────────────────────────────── */
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
      display: flex; align-items: center; justify-content: space-between;
      background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, transparent 100%);
      z-index: 50; pointer-events: none;
      opacity: 0; transition: opacity 0.6s ease;
    }
    #hud.visible { opacity: 1; }

    .hud-brand {
      font-size: 12px; font-weight: 700;
      letter-spacing: 3.5px; text-transform: uppercase;
      color: rgba(255,255,255,0.8);
    }
    .hud-right {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 500;
      color: rgba(255,255,255,0.65);
    }

    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      flex-shrink: 0; transition: background 0.3s, box-shadow 0.3s;
    }
    .dot-ok       { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.6); }
    .dot-loading  { background: #fbbf24; box-shadow: 0 0 6px rgba(251,191,36,0.5); }
    .dot-error    { background: #f87171; box-shadow: 0 0 6px rgba(248,113,113,0.5); }

    /* ── Cesium info-box override (dark theme) ───── */
    .cesium-infoBox {
      background: rgba(12,12,20,0.92) !important;
      border: 1px solid rgba(255,255,255,0.08) !important;
      backdrop-filter: blur(12px);
    }
    .cesium-infoBox-title {
      color: #e8e8e8 !important;
      font-family: -apple-system, system-ui, sans-serif !important;
      font-size: 14px !important;
    }
    .cesium-infoBox-close {
      filter: invert(0.9) !important;
    }

    /* Hide widgets we don't need */
    .cesium-viewer-geocoderContainer,
    .cesium-viewer-toolbar { display: none !important; }
  </style>
</head>
<body>

  <!-- Loading screen -->
  <div id="loading">
    <h1>Overwatch</h1>
    <div class="spinner"></div>
  </div>

  <!-- Status HUD -->
  <div id="hud">
    <div class="hud-brand">Overwatch</div>
    <div class="hud-right">
      <span id="ac-count">&mdash;</span>
      <span class="dot dot-loading" id="dot"></span>
    </div>
  </div>

  <!-- Cesium viewport -->
  <div id="cesiumContainer"></div>

  <script>
  (async function () {
    "use strict";

    /* ═══════════════════════════════════════════════
       CONFIG
       ═══════════════════════════════════════════════ */
    const ION_TOKEN  = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IlJ5X2xoemp0YVVQbkk0eGgiLCJqdGkiOiIxNDZjZTU3Ny1mYmI3LTRjMzMtYTQwNC1hZWFjZDY3MTBhZjUiLCJpZCI6NTQyNTA4LCJzdWIiOiJ0YXNzaW5qcCIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiJodHRwczovL3Rhc3NpbmpwLmdpdGh1Yi5pby8iLCJpYXQiOjE3OTM3OTc4MTl9.2LdhSKqWqxfqu6bXEJzGZroxoFIcVEcJfyrW9WEujDE";
    const WORKER     = "https://overwatch.tassinjp.workers.dev";
    const REFRESH_MS = 15000;   // 15-second aircraft refresh
    const FT_TO_M    = 0.3048;
    const DEFAULT_ALT_M = 3000; // fallback when alt_baro missing

    /* ═══════════════════════════════════════════════
       DOM refs
       ═══════════════════════════════════════════════ */
    const $loading = document.getElementById("loading");
    const $hud     = document.getElementById("hud");
    const $count   = document.getElementById("ac-count");
    const $dot     = document.getElementById("dot");

    /* ═══════════════════════════════════════════════
       AIRCRAFT ICON  (top-down planform, gold)
       Pointing UP = 0° heading = north
       ═══════════════════════════════════════════════ */
    const PLANE_SVG = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
      <path d="M16 3 L14.2 13 L3.5 17.8 L3.5 19.6 L14.2 16.8
               L14.2 25.8 L10.5 28 L10.5 29.5 L16 27.2 L21.5 29.5
               L21.5 28 L17.8 25.8 L17.8 16.8 L28.5 19.6 L28.5 17.8
               L17.8 13 Z"
            fill="#FFCC00" stroke="rgba(0,0,0,0.45)" stroke-width="0.6"
            stroke-linejoin="round"/>
    </svg>`;
    const planeIcon = "data:image/svg+xml," + encodeURIComponent(PLANE_SVG);

    /* ═══════════════════════════════════════════════
       INIT CESIUM
       ═══════════════════════════════════════════════ */
    Cesium.Ion.defaultAccessToken = ION_TOKEN;

    const viewer = new Cesium.Viewer("cesiumContainer", {
      globe: false,                        // Google 3D tiles replace the globe
      skyAtmosphere: false,                // no atmo haze without a globe
      animation: false,
      timeline: false,
      homeButton: false,
      sceneModePicker: false,
      baseLayerPicker: false,
      navigationHelpButton: false,
      fullscreenButton: false,
      selectionIndicator: true,
      infoBox: true,
      shadows: false,
      msaaSamples: 2,
      useBrowserRecommendedResolution: true,
      orderIndependentTranslucency: false,
      contextOptions: {
        webgl: { antialias: true, powerPreference: "high-performance" }
      }
    });

    /* Faster touch, no look-around (confusing on mobile) */
    const ssc = viewer.scene.screenSpaceCameraController;
    ssc.enableTilt   = true;
    ssc.enableLook   = false;
    ssc.minimumZoomDistance = 250;   // don't clip into terrain

    /* ═══════════════════════════════════════════════
       GOOGLE PHOTOREALISTIC 3D TILES
       ═══════════════════════════════════════════════ */
    try {
      const tileset = await Cesium.createGooglePhotorealistic3DTileset();
      viewer.scene.primitives.add(tileset);
    } catch (err) {
      console.error("Failed to load Google 3D Tiles:", err);
      $loading.innerHTML =
        `<h1 style="margin-bottom:14px">Overwatch</h1>
         <p style="color:#f87171;font-size:13px;max-width:280px;text-align:center;line-height:1.5;">
           Failed to load 3D tiles.<br>
           Check that Google Photorealistic 3D Tiles is added in your
           <a href="https://ion.cesium.com/assets" style="color:#93c5fd" target="_blank">Cesium ion assets</a>
           and that your token is valid.
         </p>`;
      return;
    }

    /* ═══════════════════════════════════════════════
       CAMERA  — start high, fly down to CONUS
       ═══════════════════════════════════════════════ */
    // Instant jump to starting altitude
    viewer.camera.setView({
      destination: Cesium.Cartesian3.fromDegrees(-98, 39, 18000000),
      orientation: {
        heading: 0,
        pitch: Cesium.Math.toRadians(-90),
        roll: 0
      }
    });

    // After a beat, smooth fly-in
    setTimeout(() => {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(-98, 39, 4800000),
        orientation: {
          heading: 0,
          pitch: Cesium.Math.toRadians(-90),
          roll: 0
        },
        duration: 3.5,
        easingFunction: Cesium.EasingFunction.CUBIC_IN_OUT
      });
    }, 800);

    /* ═══════════════════════════════════════════════
       DISMISS LOADING after first meaningful render
       ═══════════════════════════════════════════════ */
    let loadDismissed = false;
    function dismissLoading() {
      if (loadDismissed) return;
      loadDismissed = true;
      $loading.classList.add("hidden");
      $hud.classList.add("visible");
      viewer.scene.postRender.removeEventListener(dismissLoading);
    }
    viewer.scene.postRender.addEventListener(dismissLoading);
    // Safety fallback: if postRender never fires (unlikely), dismiss after 4s
    setTimeout(dismissLoading, 4000);

    /* ═══════════════════════════════════════════════
       AIRCRAFT LAYER
       ═══════════════════════════════════════════════ */
    const planes = new Map();   // hex → Entity

    function setDot(cls) {
      $dot.className = "dot dot-" + cls;
    }

    function descriptionHtml(a) {
      const callsign = (a.flight || "").trim() || "—";
      const type     = a.t || "—";
      const reg      = a.r || "—";
      const alt      = typeof a.alt_baro === "number"
                         ? a.alt_baro.toLocaleString() + " ft" : "Ground";
      const spd      = typeof a.gs === "number"
                         ? Math.round(a.gs) + " kts" : "—";
      const hdg      = typeof a.track === "number"
                         ? Math.round(a.track) + "°" : "—";
      const squawk   = a.squawk || "—";

      return `<div style="font-family:-apple-system,system-ui,sans-serif;
                          font-size:13px;color:#ccc;line-height:1.7;">
        <table style="border-collapse:collapse;width:100%;">
          <tr><td style="color:#888;padding:2px 10px 2px 0;">Callsign</td><td style="font-weight:600;color:#eee;">${callsign}</td></tr>
          <tr><td style="color:#888;padding:2px 10px 2px 0;">Type</td><td>${type}</td></tr>
          <tr><td style="color:#888;padding:2px 10px 2px 0;">Registration</td><td>${reg}</td></tr>
          <tr><td style="color:#888;padding:2px 10px 2px 0;">Altitude</td><td>${alt}</td></tr>
          <tr><td style="color:#888;padding:2px 10px 2px 0;">Speed</td><td>${spd}</td></tr>
          <tr><td style="color:#888;padding:2px 10px 2px 0;">Heading</td><td>${hdg}</td></tr>
          <tr><td style="color:#888;padding:2px 10px 2px 0;">Squawk</td><td>${squawk}</td></tr>
          <tr><td style="color:#888;padding:2px 10px 2px 0;">ICAO Hex</td><td style="font-family:menlo,monospace;font-size:12px;">${(a.hex || "").toUpperCase()}</td></tr>
        </table>
      </div>`;
    }

    async function refreshAircraft() {
      setDot("loading");
      try {
        const res = await fetch(WORKER + "/air");
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const ac = data.ac || [];

        const seen = new Set();

        for (const a of ac) {
          if (a.lat == null || a.lon == null) continue;
          const hex = a.hex;
          seen.add(hex);

          // Altitude in metres; ground → 200 m so icon sits above terrain mesh
          let altM = DEFAULT_ALT_M;
          if (typeof a.alt_baro === "number") {
            altM = a.alt_baro * FT_TO_M;
            if (altM < 150) altM = 150;  // keep above ground-level tiles
          }

          const position = Cesium.Cartesian3.fromDegrees(a.lon, a.lat, altM);
          const heading  = typeof a.track === "number"
                             ? -Cesium.Math.toRadians(a.track) : 0;
          const callsign = (a.flight || "").trim();
          const label    = callsign || hex.toUpperCase();

          if (planes.has(hex)) {
            /* ── Update existing entity ── */
            const e = planes.get(hex);
            e.position  = new Cesium.ConstantPositionProperty(position);
            e.billboard.rotation = heading;
            e.label.text = label;
            e.name = label;
            e.description = descriptionHtml(a);
          } else {
            /* ── Create new entity ── */
            const e = viewer.entities.add({
              id: hex,
              position: position,
              billboard: {
                image: planeIcon,
                width: 20,
                height: 20,
                rotation: heading,
                alignedAxis: Cesium.Cartesian3.ZERO,  // screen-space
                verticalOrigin: Cesium.VerticalOrigin.CENTER,
                horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                translucencyByDistance: new Cesium.NearFarScalar(
                  100, 1.0, 20000000, 0.65
                )
              },
              label: {
                text: label,
                font: "600 10.5px -apple-system, system-ui, sans-serif",
                fillColor: Cesium.Color.WHITE,
                outlineColor: new Cesium.Color(0, 0, 0, 0.7),
                outlineWidth: 2.5,
                style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                pixelOffset: new Cesium.Cartesian2(0, -17),
                disableDepthTestDistance: Number.POSITIVE_INFINITY,
                showBackground: false,
                scale: 1.0,
                distanceDisplayCondition: new Cesium.DistanceDisplayCondition(
                  0, 8000000
                )
              },
              name: label,
              description: descriptionHtml(a)
            });
            planes.set(hex, e);
          }
        }

        /* ── Remove aircraft no longer in feed ── */
        for (const [hex, entity] of planes) {
          if (!seen.has(hex)) {
            viewer.entities.remove(entity);
            planes.delete(hex);
          }
        }

        $count.textContent = seen.size + " aircraft";
        setDot("ok");

      } catch (err) {
        console.error("Aircraft refresh failed:", err);
        setDot("error");
      }
    }

    /* First fetch, then schedule recurring */
    await refreshAircraft();
    setInterval(refreshAircraft, REFRESH_MS);

  })();
  </script>
</body>
</html>
